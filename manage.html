<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function (e) {
      try { e.setAttribute("data-motion", matchMedia("(prefers-reduced-motion: reduce)").matches ? "reduce" : "full"); }
      catch (_) { e.setAttribute("data-motion", "full"); }
    })(document.documentElement);
  </script>

  <title>Manage your booking — OJA Solutions</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111619">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/main.css">

  <script>
    window.OJA = {
      apiBase: "https://api.otakar.dev",
      turnstileSiteKey: "",
      emailUser: "hello",
      emailDomain: "otakar.dev"
    };
  </script>
  <script src="/assets/js/scheduler/providers/worker-provider.js" defer></script>
  <script src="/assets/js/scheduler/providers/mock-provider.js" defer></script>
  <script src="/assets/js/scheduler/oja-scheduler.js" defer></script>
  <script src="/assets/js/scheduler/manage.js" defer></script>
</head>

<body id="top">
  <header class="site-header" data-static-header>
    <div class="site-header__inner">
      <a class="brand" href="/" aria-label="OJA Solutions — home">
        <svg class="brand__mark" viewBox="0 0 192 80" fill="none" aria-hidden="true" focusable="false">
          <g stroke="currentColor" stroke-width="11" stroke-linecap="square" stroke-linejoin="round">
            <rect x="6" y="10" width="52" height="60" rx="17"/>
            <path d="M118 10 V48 a22 22 0 0 1 -44 0"/>
            <path d="M134 70 L160 10 L186 70 M143 50 H177"/>
          </g>
        </svg>
        <span class="brand__name">Solutions</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a class="btn nav__cta" href="/#book">Book a call</a>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="section">
      <div class="container container--text">
        <div class="panel manage" id="manage">
          <div class="sched__state">
            <span class="sched__spinner" aria-hidden="true"></span>
            <p>Loading your booking…</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer surface-dark">
    <div class="container">
      <div class="footer__fine">
        <span>© <span data-year>2026</span> OJA Solutions LLC · Beaverton, Oregon</span>
        <span><a href="/">otakar.dev</a></span>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var y = document.querySelector("[data-year]");
      if (y) y.textContent = String(new Date().getFullYear());
    })();
  </script>
</body>
</html>
