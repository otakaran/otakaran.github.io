<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 495" role="img" aria-label="Mockup of a booking website: an availability calendar with selectable time slots beside automated confirmation and reminder message cards.">
  <defs>
    <pattern id="bg" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45" fill="none" stroke="#2a333b" stroke-width="1" opacity="0.4"/>
    </pattern>
    <style>
      .panel{fill:#171d21;stroke:#303a42;stroke-width:1.5}
      .raised{fill:#212931;stroke:#3a4651;stroke-width:1.5}
      .h{fill:#eef1f3;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif;font-weight:700}
      .t{fill:#c5ccd1;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif}
      .m{fill:#909aa1;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em}
      .slot{fill:#1b2228;stroke:#3a4651;stroke-width:1.5}
      .slott{fill:#bcc3c8;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
    </style>
  </defs>
  <rect width="720" height="495" fill="#111619"/>
  <rect width="720" height="495" fill="url(#bg)"/>
  <text x="32" y="44" class="m" font-size="14">FIG · BOOKING &amp; FOLLOW-UP</text>

  <!-- Browser chrome -->
  <rect x="32" y="64" width="656" height="400" rx="12" class="panel"/>
  <line x1="32" y1="100" x2="688" y2="100" stroke="#303a42" stroke-width="1.5"/>
  <circle cx="52" cy="82" r="4" fill="#586771"/>
  <circle cx="68" cy="82" r="4" fill="#586771"/>
  <circle cx="84" cy="82" r="4" fill="#586771"/>
  <rect x="104" y="74" width="380" height="16" rx="8" fill="#111619" stroke="#303a42" stroke-width="1"/>
  <text x="118" y="86" class="m" font-size="11">yourbusiness.com / book</text>

  <!-- Calendar panel -->
  <text x="56" y="134" class="h" font-size="18">Pick a time</text>
  <text x="56" y="156" class="t" font-size="13" fill="#909aa1">Thursday, June 19</text>

  <!-- slots -->
  <g>
    <rect x="56" y="172" width="150" height="40" rx="8" class="slot"/>
    <text x="131" y="197" text-anchor="middle" class="slott">9:00 AM</text>
    <rect x="220" y="172" width="150" height="40" rx="8" fill="#157f4b" stroke="#2bc079" stroke-width="2"/>
    <text x="295" y="197" text-anchor="middle" class="slott" fill="#eafff3">10:30 AM</text>
    <rect x="56" y="224" width="150" height="40" rx="8" class="slot"/>
    <text x="131" y="249" text-anchor="middle" class="slott">1:00 PM</text>
    <rect x="220" y="224" width="150" height="40" rx="8" class="slot"/>
    <text x="295" y="249" text-anchor="middle" class="slott">2:30 PM</text>
    <rect x="56" y="276" width="150" height="40" rx="8" class="slot"/>
    <text x="131" y="301" text-anchor="middle" class="slott">3:30 PM</text>
    <rect x="220" y="276" width="150" height="40" rx="8" class="slot"/>
    <text x="295" y="301" text-anchor="middle" class="slott">4:00 PM</text>
  </g>
  <rect x="56" y="340" width="314" height="44" rx="8" fill="#f2641b"/>
  <text x="213" y="368" text-anchor="middle" class="h" font-size="15" fill="#111619">Confirm booking</text>

  <!-- Automation cards -->
  <rect x="406" y="124" width="256" height="78" rx="10" class="raised"/>
  <circle cx="430" cy="148" r="9" fill="#157f4b"/>
  <path d="M425 148l4 4 6-8" stroke="#eafff3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="146" class="h" font-size="14">Confirmation sent</text>
  <text x="450" y="166" class="t" font-size="12" fill="#909aa1">Email + calendar invite, instantly</text>
  <text x="450" y="186" class="m" font-size="11" fill="#2bc079">AUTO</text>

  <rect x="406" y="216" width="256" height="78" rx="10" class="raised"/>
  <circle cx="430" cy="240" r="9" fill="#303a42"/>
  <path d="M430 235v5l3 2" stroke="#bcc3c8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="450" y="238" class="h" font-size="14">Reminder scheduled</text>
  <text x="450" y="258" class="t" font-size="12" fill="#909aa1">24h before · SMS + email</text>
  <text x="450" y="278" class="m" font-size="11" fill="#909aa1">QUEUED</text>

  <rect x="406" y="308" width="256" height="78" rx="10" class="raised"/>
  <circle cx="430" cy="332" r="9" fill="#303a42"/>
  <path d="M426 332h8M430 328v8" stroke="#ff7e3e" stroke-width="2" stroke-linecap="round"/>
  <text x="450" y="330" class="h" font-size="14">No-show follow-up</text>
  <text x="450" y="350" class="t" font-size="12" fill="#909aa1">Rebook link if they miss it</text>
  <text x="450" y="370" class="m" font-size="11" fill="#ff7e3e">ON MISS</text>
</svg>
