<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 495" role="img" aria-label="Mockup of document extraction: a scanned invoice on the left flows into a clean structured data table on the right, with a human approval step before it is saved.">
  <defs>
    <pattern id="bg3" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45" fill="none" stroke="#2a333b" stroke-width="1" opacity="0.4"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ff7e3e"/>
    </marker>
    <style>
      .panel{fill:#171d21;stroke:#303a42;stroke-width:1.5}
      .h{fill:#eef1f3;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif;font-weight:700}
      .t{fill:#c5ccd1;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif}
      .m{fill:#909aa1;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em}
      .cell{fill:#bcc3c8;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
      .docline{stroke:#44505a;stroke-width:5;stroke-linecap:round}
    </style>
  </defs>
  <rect width="720" height="495" fill="#111619"/>
  <rect width="720" height="495" fill="url(#bg3)"/>
  <text x="32" y="44" class="m" font-size="14">FIG · DOCUMENTS IN · CLEAN DATA OUT</text>

  <!-- Source document -->
  <text x="40" y="92" class="m" font-size="12" fill="#6e7c85">INVOICE.PDF</text>
  <rect x="40" y="104" width="180" height="280" rx="8" fill="#212931" stroke="#3a4651" stroke-width="1.5"/>
  <line class="docline" x1="64" y1="136" x2="150" y2="136"/>
  <line class="docline" x1="64" y1="160" x2="196" y2="160" opacity="0.6"/>
  <line class="docline" x1="64" y1="180" x2="196" y2="180" opacity="0.6"/>
  <rect x="64" y="210" width="132" height="1.5" fill="#44505a"/>
  <line class="docline" x1="64" y1="232" x2="196" y2="232" opacity="0.6"/>
  <line class="docline" x1="64" y1="252" x2="160" y2="252" opacity="0.6"/>
  <line class="docline" x1="64" y1="272" x2="196" y2="272" opacity="0.6"/>
  <rect x="64" y="320" width="80" height="34" rx="6" fill="#157f4b" opacity="0.35" stroke="#2bc079" stroke-width="1.5"/>
  <text x="76" y="342" class="cell" fill="#2bc079">$1,240.00</text>

  <!-- Arrow / extract engine -->
  <line x1="232" y1="244" x2="280" y2="244" stroke="#ff7e3e" stroke-width="2.5" marker-end="url(#ar)"/>
  <circle cx="256" cy="200" r="3" fill="#2bc079"/>

  <!-- Extracted table card -->
  <rect x="292" y="104" width="388" height="218" rx="10" class="panel"/>
  <text x="312" y="134" class="h" font-size="15">Extracted</text>
  <text x="540" y="134" class="m" font-size="11" fill="#909aa1">3 FIELDS · 98%</text>
  <line x1="312" y1="148" x2="660" y2="148" stroke="#303a42" stroke-width="1.5"/>
  <text x="312" y="178" class="m" font-size="12" fill="#6e7c85">VENDOR</text>
  <text x="500" y="178" class="cell">Northgate Supply Co.</text>
  <line x1="312" y1="196" x2="660" y2="196" stroke="#222a30" stroke-width="1"/>
  <text x="312" y="226" class="m" font-size="12" fill="#6e7c85">INVOICE #</text>
  <text x="500" y="226" class="cell">NG-20461</text>
  <line x1="312" y1="244" x2="660" y2="244" stroke="#222a30" stroke-width="1"/>
  <text x="312" y="274" class="m" font-size="12" fill="#6e7c85">TOTAL</text>
  <text x="500" y="274" class="cell" fill="#2bc079" font-weight="700">$1,240.00</text>
  <line x1="312" y1="292" x2="660" y2="292" stroke="#222a30" stroke-width="1"/>
  <text x="312" y="312" class="t" font-size="12" fill="#909aa1">Mapped to your accounting fields</text>

  <!-- Human approval bar -->
  <rect x="292" y="338" width="388" height="58" rx="10" fill="#1b2228" stroke="#303a42" stroke-width="1.5"/>
  <text x="312" y="364" class="h" font-size="14">Review before save</text>
  <text x="312" y="384" class="t" font-size="12" fill="#909aa1">A person confirms — nothing posts unchecked</text>
  <rect x="560" y="354" width="100" height="32" rx="8" fill="#157f4b"/>
  <path d="M584 370l5 5 9-11" stroke="#eafff3" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="606" y="375" class="h" font-size="13" fill="#eafff3">Approve</text>
</svg>
