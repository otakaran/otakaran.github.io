# Runs the booking API's unit tests (worker/) on every push and pull request
# that touches it. No secrets needed. Deploys stay manual (`npm run deploy`
# from worker/ with the local wrangler login) — see DEPLOY.md §2.
name: worker tests

on:
  push:
    branches: [master]
    paths: ["worker/**", ".github/workflows/worker-tests.yml"]
  pull_request:
    paths: ["worker/**", ".github/workflows/worker-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
