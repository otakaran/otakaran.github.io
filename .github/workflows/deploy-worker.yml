# Manual deploy of the booking API (worker/) to api.otakar.dev.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts Edit, D1 Edit,
# Workers Routes Edit, Zone Read on otakar.dev) and CLOUDFLARE_ACCOUNT_ID.
# Trigger: Actions → "deploy worker" → Run workflow, or
#   gh workflow run deploy-worker.yml
name: deploy worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Require the Cloudflare token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID on this repo first (gh secret set …). See DEPLOY.md §4."
            exit 1
          fi
      - name: Migrate + deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: |
            d1 migrations apply oja-booking --remote
            deploy
